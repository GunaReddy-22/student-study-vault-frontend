<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>iPad Handwriting Studio Pro</title>
<style>
  :root {
    --bg-workspace: #080d1a;
    --paper-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
    --panel-bg: rgba(15, 23, 42, 0.92);
    --panel-border: rgba(255, 255, 255, 0.1);
    --accent: #6366f1;
    --accent-gradient: linear-gradient(135deg, #6366f1, #4f46e5);
    --accent-glow: rgba(99, 102, 241, 0.45);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    background-color: var(--bg-workspace);
    color: #f8fafc;
    height: 100%;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
    touch-action: pan-y pinch-zoom;
  }

  /* ============================================================
     🍎 SLEEK APPLE-INSPIRED HEADER & TOOLBAR
     ============================================================ */
  .studio-header {
    background: var(--panel-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    z-index: 100;
    flex-shrink: 0;
    box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* Main Top Navigation Row */
  .header-main-row {
    height: 52px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-left, .header-center, .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .app-branding {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    white-space: nowrap;
  }
  .app-branding .logo-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--accent-gradient);
    font-size: 14px;
    box-shadow: 0 2px 8px var(--accent-glow);
  }

  .paper-dropdown {
    height: 34px;
    padding: 0 10px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #cbd5e1;
    font-size: 12.5px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .paper-dropdown:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(99, 102, 241, 0.4);
    color: #ffffff;
  }
  .paper-dropdown option {
    background: #0f172a;
    color: #f8fafc;
  }

  /* Segmented Category Toolbar */
  .category-tool-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(2, 6, 23, 0.6);
    padding: 3px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .cat-tab-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .cat-tab-btn .tab-icon {
    font-size: 15px;
  }
  .cat-tab-btn:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.06);
  }
  .cat-tab-btn.active {
    background: var(--accent-gradient);
    color: #ffffff;
    box-shadow: 0 2px 10px var(--accent-glow);
  }

  /* Action Buttons */
  .action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 34px;
    padding: 0 12px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
    user-select: none;
  }
  .btn-ghost {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.1);
    color: #cbd5e1;
  }
  .btn-ghost:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
  }
  .btn-ghost:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .btn-danger-ghost {
    background: rgba(239, 68, 68, 0.12);
    border-color: rgba(239, 68, 68, 0.25);
    color: #f87171;
  }
  .btn-danger-ghost:hover {
    background: rgba(239, 68, 68, 0.25);
    color: #ffffff;
  }
  .btn-done-primary {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
  }
  .btn-done-primary:hover {
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    transform: translateY(-1px);
  }

  .zoom-pill-group {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 2px;
  }
  .zoom-pill-group button {
    background: transparent;
    border: none;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 700;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    cursor: pointer;
  }
  .zoom-pill-group button:hover {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }
  .zoom-pill-label {
    font-size: 11px;
    font-weight: 600;
    color: #94a3b8;
    padding: 0 6px;
  }

  /* ============================================================
     🎛️ CONTEXTUAL TOOL INSPECTOR TRAY (APPLE STYLE)
     ============================================================ */
  .contextual-tray {
    background: rgba(10, 16, 30, 0.96);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    min-height: 48px;
  }
  .contextual-tray::-webkit-scrollbar { display: none; }

  .tray-section {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .tray-divider {
    width: 1px;
    height: 24px;
    background: rgba(255, 255, 255, 0.12);
    flex-shrink: 0;
  }

  /* Sub-tool pill buttons */
  .subtool-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .subtool-pill:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
  }
  .subtool-pill.active {
    background: rgba(99, 102, 241, 0.25);
    border-color: rgba(99, 102, 241, 0.8);
    color: #c7d2fe;
    font-weight: 600;
  }

  /* Color Palette Dots */
  .palette-cluster {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .color-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .color-dot:hover { transform: scale(1.2); }
  .color-dot.active {
    border-color: #ffffff;
    transform: scale(1.25);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
  }

  .custom-color-input {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: transparent;
    cursor: pointer;
    padding: 0;
    outline: none;
  }

  /* Slider & Stepper Inputs */
  .tray-slider-unit {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: #94a3b8;
    font-weight: 600;
  }
  .tray-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 80px;
    height: 5px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.18);
    outline: none;
    cursor: pointer;
  }
  .tray-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 8px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  /* ============================================================
     📜 CANVAS WORKSPACE
     ============================================================ */
  .canvas-workspace {
    flex: 1;
    overflow: auto;
    position: relative;
    background-color: var(--bg-workspace);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 120px 16px;
    cursor: default;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y;
  }
  .canvas-workspace.panning-mode {
    cursor: grab !important;
  }
  .canvas-workspace.panning-active {
    cursor: grabbing !important;
  }

  .paper-container {
    position: relative;
    box-shadow: var(--paper-shadow);
    border-radius: 8px;
    background: #ffffff;
    width: 96vw;
    max-width: 1200px;
    transition: transform 0.15s ease-out;
    transform-origin: top center;
  }

  #bgCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
    border-radius: 8px;
    pointer-events: none;
  }

  #inkCanvas {
    position: relative;
    width: 100%;
    height: auto;
    display: block;
    z-index: 2;
    cursor: crosshair;
    touch-action: none;
    background: transparent;
    border-radius: 8px;
  }

  /* Interactive Text Layer */
  #textOverlayContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  .canvas-textbox {
    position: absolute;
    pointer-events: auto;
    border: 1px dashed rgba(99, 102, 241, 0.8);
    background: rgba(15, 23, 42, 0.85);
    color: #ffffff;
    border-radius: 8px;
    padding: 8px 12px;
    min-width: 120px;
    min-height: 40px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    outline: none;
    font-size: 18px;
    line-height: 1.4;
    resize: both;
    overflow: auto;
  }
  .canvas-textbox:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4);
  }

  /* Continuous End of Paper Indicator */
  .continuous-scroll-indicator {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }
  .infinite-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .infinite-pill:hover {
    background: rgba(99, 102, 241, 0.2);
    color: #ffffff;
    border-color: rgba(99, 102, 241, 0.5);
  }

  /* Floating Quick Mode Switcher (Draw ✍️ vs Pan ✋) */
  .floating-nav-pill {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(99, 102, 241, 0.45);
    border-radius: 30px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    cursor: pointer;
    user-select: none;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .floating-nav-pill:hover {
    background: rgba(30, 41, 59, 0.98);
    border-color: rgba(99, 102, 241, 0.8);
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.75);
  }
  .floating-nav-pill.panning-active {
    background: var(--accent-gradient);
    border-color: rgba(165, 180, 252, 0.7);
    box-shadow: 0 10px 30px rgba(79, 70, 229, 0.6);
  }

  /* Device recommendation badge */
  .device-recommendation-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.18), rgba(56, 189, 248, 0.12));
    border: 1px solid rgba(99, 102, 241, 0.35);
    color: #c7d2fe;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    user-select: none;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .device-recommendation-badge:hover,
  .device-recommendation-badge:focus {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(56, 189, 248, 0.25));
    border-color: rgba(99, 102, 241, 0.7);
    color: #ffffff;
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
  }
  .device-recommendation-badge .device-badge-icon {
    font-size: 13px;
  }
  .device-tooltip-popup {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: 250px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.96);
    border: 1px solid rgba(99, 102, 241, 0.5);
    box-shadow: 0 12px 30px rgba(0,0,0,0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #e2e8f0;
    font-size: 11.5px;
    line-height: 1.45;
    font-weight: 400;
    z-index: 1000;
    transform: translateY(-4px);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    white-space: normal;
  }
  .device-tooltip-popup .tooltip-header {
    font-weight: 700;
    color: #818cf8;
    margin-bottom: 4px;
    font-size: 12px;
  }
  .device-recommendation-badge:hover .device-tooltip-popup,
  .device-recommendation-badge:focus .device-tooltip-popup {
    visibility: visible;
    opacity: 1;
    transform: translateY(0);
  }

  .header-mobile-category-bar {
    display: none;
    padding: 6px 12px;
    background: rgba(6, 11, 24, 0.95);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .header-mobile-category-bar::-webkit-scrollbar { display: none; }

  /* Mobile Responsive Media Query */
  @media (max-width: 860px) {
    .header-main-row {
      height: 48px;
      padding: 0 8px;
      gap: 6px;
    }
    .header-center {
      display: none !important;
    }
    .header-mobile-category-bar {
      display: flex !important;
    }
    .header-left {
      gap: 6px;
      flex-shrink: 1;
      min-width: 0;
    }
    .brand-title {
      display: none;
    }
    .device-badge-text {
      display: none;
    }
    .device-recommendation-badge {
      padding: 4px 6px;
    }
    .paper-dropdown {
      height: 32px;
      padding: 0 6px;
      font-size: 11.5px;
      max-width: 110px;
    }
    .header-right {
      gap: 5px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .header-right .zoom-pill-group {
      display: none;
    }
    .btn-label-text {
      display: none;
    }
    .action-btn {
      height: 32px;
      padding: 0 8px;
      font-size: 12px;
    }
    .btn-done-primary {
      padding: 0 12px !important;
      font-weight: 700 !important;
      background: linear-gradient(135deg, #10b981, #059669) !important;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4) !important;
    }
    .btn-save-text {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      margin-left: 2px;
    }
    .paper-container {
      width: 100vw;
      border-radius: 0;
    }
    .canvas-workspace {
      padding: 6px 0 100px 0;
    }
    .floating-nav-pill {
      bottom: 16px;
      right: 16px;
      padding: 8px 14px;
      font-size: 12px;
    }
  }

  @media (max-width: 480px) {
    .header-main-row {
      padding: 0 6px;
      gap: 4px;
    }
    .paper-dropdown {
      max-width: 90px;
      font-size: 11px;
    }
    .action-btn {
      padding: 0 6px;
    }
    .btn-done-primary {
      padding: 0 10px !important;
    }
    .cat-tab-btn {
      padding: 5px 8px;
      font-size: 11.5px;
    }
  }
</style>
</head>
<body>

<!-- 🍎 RESPONSIVE HEADER & CONSOLIDATED APPLE TOOLBAR -->
<header class="studio-header">
  <!-- Top Bar: Branding, Paper, Recommendation Hint, Undo/Redo, Cancel & Save -->
  <div class="header-main-row">
    <div class="header-left">
      <div class="app-branding">
        <span class="logo-badge">🎨</span>
        <span class="brand-title">Studio</span>
      </div>

      <select id="paper-select" class="paper-dropdown" onchange="changePaperStyle(this.value)" title="Select Paper Style">
        <option value="ruled">📝 Ruled Paper</option>
        <option value="grid">📐 Math Grid</option>
        <option value="dots">▫️ Dot Matrix</option>
        <option value="white">📄 Blank White</option>
        <option value="cornell">📑 Cornell Notes</option>
        <option value="dark">🌑 Dark Mode</option>
        <option value="cream">📜 Vintage Cream</option>
      </select>

      <!-- Hoverable Device Recommendation Tooltip Badge -->
      <div class="device-recommendation-badge" tabindex="0" title="Handwritten notes are recommended on laptops & tablets with a stylus for maximum writing precision.">
        <span class="device-badge-icon">💻</span>
        <span class="device-badge-text">Recommended for Laptops & Tabs</span>
        <div class="device-tooltip-popup">
          <div class="tooltip-header">💡 Device Advice</div>
          <div>Handwriting canvas is best experienced on laptops, tablets, and styluses for precise note-taking.</div>
        </div>
      </div>
    </div>

    <!-- Center Segmented Categories (Desktop view) -->
    <div class="header-center">
      <div class="category-tool-tabs">
        <button class="cat-tab-btn active" id="tab-pen" onclick="switchCategory('pen')">
          <span class="tab-icon">✏️</span>
          <span>Pens</span>
        </button>
        <button class="cat-tab-btn" id="tab-eraser" onclick="switchCategory('eraser')">
          <span class="tab-icon">🧽</span>
          <span>Eraser</span>
        </button>
        <button class="cat-tab-btn" id="tab-shape" onclick="switchCategory('shape')">
          <span class="tab-icon">🔷</span>
          <span>Shapes</span>
        </button>
        <button class="cat-tab-btn" id="tab-text" onclick="switchCategory('text')">
          <span class="tab-icon">🔤</span>
          <span>Text</span>
        </button>
        <button class="cat-tab-btn" id="tab-hand" onclick="switchCategory('hand')">
          <span class="tab-icon">✋</span>
          <span>Pan</span>
        </button>
      </div>
    </div>

    <!-- Right Actions: Undo, Redo, Cancel & Always-Visible Save Button -->
    <div class="header-right">
      <div class="zoom-pill-group">
        <button onclick="adjustZoom(-0.15)" title="Zoom Out">−</button>
        <span class="zoom-pill-label" id="zoom-label">100%</span>
        <button onclick="adjustZoom(0.15)" title="Zoom In">+</button>
      </div>

      <button class="action-btn btn-ghost" id="btn-undo" onclick="handleUndo()" title="Undo (Ctrl+Z)" disabled>↩️<span class="btn-label-text"> Undo</span></button>
      <button class="action-btn btn-ghost" id="btn-redo" onclick="handleRedo()" title="Redo (Ctrl+Y)" disabled>↪️<span class="btn-label-text"> Redo</span></button>
      <button class="action-btn btn-danger-ghost" onclick="cancelAndExit()" title="Cancel & Discard">✕<span class="btn-label-text"> Cancel</span></button>
      <button class="action-btn btn-done-primary" id="btn-save-note" onclick="saveAndExport()" title="Save Note drawing to vault">💾<span class="btn-save-text"> Save Note</span></button>
    </div>
  </div>

  <!-- Mobile Category & Zoom Bar (Shown on Mobile / Tablets) -->
  <div class="header-mobile-category-bar">
    <div class="category-tool-tabs mobile-tabs">
      <button class="cat-tab-btn active" id="tab-pen-m" onclick="switchCategory('pen')">
        <span class="tab-icon">✏️</span>
        <span>Pens</span>
      </button>
      <button class="cat-tab-btn" id="tab-eraser-m" onclick="switchCategory('eraser')">
        <span class="tab-icon">🧽</span>
        <span>Eraser</span>
      </button>
      <button class="cat-tab-btn" id="tab-shape-m" onclick="switchCategory('shape')">

function createDivider() {

// Tool switchers
function setPenType(t) {

}
function selectColor(hex) {

  activeTextColor = hex;

}

function setShapeType(t) {

function toggleHandPanMode() {

function updateFloatingPillUI() {
  const pill = document.getElementById('floating-mode-pill');
  const icon = document.getElementById('floating-pill-icon');
  const label = document.getElementById('floating-pill-label');
  if (!pill || !icon || !label) return;

  if (currentCategory === 'hand') {

    icon.textContent = '✋';
    label.textContent = 'Hand Scroll';
  }
}

// ============================================================
// 📐 PAPER BACKGROUND ENGINE (LAYER 1)
// ============================================================
function drawPaperBackground(context, width, height, paperType) {
  context.save();
  context.clearRect(0, 0, width, height);

  let bgColor = '#ffffff';
  let lineColor = 'rgba(79, 140, 255, 0.22)';
  let marginColor = 'rgba(239, 68, 68, 0.4)';

  if (paperType === 'dark') {
    bgColor = '#0f172a';
    lineColor = 'rgba(255, 255, 255, 0.12)';
  } else if (paperType === 'cream') {
    bgColor = '#fdfbf7';
    lineColor = 'rgba(180, 150, 120, 0.25)';
  }

  context.fillStyle = bgColor;
  context.fillRect(0, 0, width, height);

  if (paperType === 'ruled' || paperType === 'dark' || paperType === 'cream') {
    const lineGap = 36;
    context.strokeStyle = lineColor;
    context.lineWidth = 1;
    for (let y = lineGap * 2; y < height; y += lineGap) {
      context.beginPath();
      context.moveTo(0, y);
      context.lineTo(width, y);
      context.stroke();
    }
    context.strokeStyle = marginColor;
    context.lineWidth = 1.5;
    context.beginPath();
    context.moveTo(90, 0);
    context.lineTo(90, height);
    context.stroke();
  } else if (paperType === 'grid') {
    const grid = 28;
    context.strokeStyle = lineColor;
    context.lineWidth = 0.8;
    for (let x = grid; x < width; x += grid) {
      context.beginPath();
      context.moveTo(x, 0);
      context.lineTo(x, height);
      context.stroke();
    }
    for (let y = grid; y < height; y += grid) {
      context.beginPath();
      context.moveTo(0, y);
      context.lineTo(width, y);
      context.stroke();
    }
  } else if (paperType === 'dots') {
    const dotGap = 28;
    context.fillStyle = lineColor;
    for (let x = dotGap; x < width; x += dotGap) {
      for (let y = dotGap; y < height; y += dotGap) {
        context.beginPath();
        context.arc(x, y, 1.2, 0, Math.PI * 2);
        context.fill();
      }
    }
  } else if (paperType === 'cornell') {
    context.strokeStyle = lineColor;
    context.lineWidth = 1;
    for (let y = 72; y < height - 140; y += 36) {
      context.beginPath();
      context.moveTo(260, y);
      context.lineTo(width, y);
      context.stroke();
    }
    context.strokeStyle = 'rgba(99, 102, 241, 0.4)';
    context.lineWidth = 2;
    context.beginPath();
    context.moveTo(260, 0);
    context.lineTo(260, height - 140);
    context.stroke();

    context.beginPath();
    context.moveTo(0, height - 140);
    context.lineTo(width, height - 140);
    context.stroke();
  }

  context.restore();
}

function changePaperStyle(style) {
  activePaper = style;
  drawPaperBackground(bgCtx, canvasWidth, canvasHeight, style);
}

// Auto-expand canvas
let isExpanding = false;
function expandCanvasHeight(addedHeight = 1500) {
  if (isExpanding) return;
  isExpanding = true;

  saveHistorySnapshot();

  const tempInk = document.createElement('canvas');
  tempInk.width = inkCanvas.width;
  tempInk.height = inkCanvas.height;
  tempInk.getContext('2d').drawImage(inkCanvas, 0, 0);

  canvasHeight += addedHeight;
  bgCanvas.height = canvasHeight;
  inkCanvas.height = canvasHeight;

  drawPaperBackground(bgCtx, canvasWidth, canvasHeight, activePaper);
  inkCtx.drawImage(tempInk, 0, 0);

  setTimeout(() => { isExpanding = false; }, 100);
}

function checkInfiniteScroll() {
  const scrollRemaining = workspace.scrollHeight - (workspace.scrollTop + workspace.clientHeight);
  if (scrollRemaining < 800) {
    expandCanvasHeight(1500);
  }
}

workspace.addEventListener('scroll', checkInfiniteScroll, { passive: true });
inkCanvas.addEventListener('wheel', (e) => {
  workspace.scrollTop += e.deltaY * 0.9;
  checkInfiniteScroll();
}, { passive: true });

// Zoom Engine
function adjustZoom(delta) {
  currentZoom = Math.min(2.5, Math.max(0.4, currentZoom + delta));
  applyZoom();
}
function applyZoom() {
  paperContainer.style.transform = `scale(${currentZoom})`;
  const txt = Math.round(currentZoom * 100) + '%';
  if (zoomLabel) zoomLabel.textContent = txt;
  const zoomLabelM = document.getElementById('zoom-label-m');
  if (zoomLabelM) zoomLabelM.textContent = txt;
}

// ============================================================
// 🔄 UNDO & REDO ENGINE
// ============================================================
function saveHistorySnapshot() {
  historyStack.push({
    image: inkCanvas.toDataURL('image/png'),
    strokes: JSON.parse(JSON.stringify(strokesList))
  });
  if (historyStack.length > 30) historyStack.shift();
  redoStack.length = 0;
  updateHistoryButtons();
}

function updateHistoryButtons() {
  document.getElementById('btn-undo').disabled = historyStack.length === 0;
  document.getElementById('btn-redo').disabled = redoStack.length === 0;
}

function handleUndo() {
  if (historyStack.length === 0) return;
  redoStack.push({
    image: inkCanvas.toDataURL('image/png'),
    strokes: JSON.parse(JSON.stringify(strokesList))
  });
  const prevState = historyStack.pop();
  strokesList = prevState.strokes || [];
  const img = new Image();
  img.onload = () => {
    inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
    inkCtx.drawImage(img, 0, 0);
    updateHistoryButtons();
  };
  img.src = prevState.image;
}

function handleRedo() {
  if (redoStack.length === 0) return;
  historyStack.push({
    image: inkCanvas.toDataURL('image/png'),
    strokes: JSON.parse(JSON.stringify(strokesList))
  });
  const nextState = redoStack.pop();
  strokesList = nextState.strokes || [];
  const img = new Image();
  img.onload = () => {
    inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
    inkCtx.drawImage(img, 0, 0);
    updateHistoryButtons();
  };
  img.src = nextState.image;
}

function clearActiveCanvas() {
  if (confirm('Clear your handwritten notes? (Paper background will stay)')) {
    saveHistorySnapshot();
    inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
    strokesList = [];
  }
}

// ============================================================
// ✍️ ADVANCED DRAWING & SHAPE ENGINE (LAYER 2)
// ============================================================
function getCanvasPos(e) {
  const rect = inkCanvas.getBoundingClientRect();
  const scaleX = inkCanvas.width / rect.width;
  const scaleY = inkCanvas.height / rect.height;

  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;

  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function configureDrawingContext() {
  inkCtx.lineCap = 'round';
  inkCtx.lineJoin = 'round';
  inkCtx.setLineDash([]);

  if (currentCategory === 'eraser') {
    inkCtx.globalCompositeOperation = 'destination-out';
    inkCtx.lineWidth = eraserWidth;
    inkCtx.globalAlpha = 1.0;
  } else if (currentCategory === 'pen') {
    inkCtx.globalCompositeOperation = 'source-over';
    inkCtx.strokeStyle = activeColor;
    inkCtx.fillStyle = activeColor;

    if (activePenType === 'highlighter') {
      inkCtx.lineWidth = activeWidth * 4.5;
      inkCtx.globalAlpha = 0.35 * activeOpacity;
      inkCtx.lineCap = 'square';
    } else if (activePenType === 'calligraphy') {
      inkCtx.lineWidth = activeWidth * 1.5;
      inkCtx.globalAlpha = 1.0 * activeOpacity;
    } else if (activePenType === 'pencil') {
      inkCtx.lineWidth = Math.max(1, activeWidth * 0.85);
      inkCtx.globalAlpha = 0.65 * activeOpacity;
    } else {
      inkCtx.lineWidth = activeWidth;
      inkCtx.globalAlpha = 1.0 * activeOpacity;
    }
  } else if (currentCategory === 'shape') {
    inkCtx.globalCompositeOperation = 'source-over';
    inkCtx.strokeStyle = activeColor;
    inkCtx.fillStyle = shapeFillMode === 'solid' ? activeColor : hexToRgba(activeColor, 0.3);
    inkCtx.lineWidth = activeWidth;
    inkCtx.globalAlpha = 1.0 * activeOpacity;

    if (shapeLineStyle === 'dashed') inkCtx.setLineDash([8, 6]);
    else if (shapeLineStyle === 'dotted') inkCtx.setLineDash([3, 5]);
    else inkCtx.setLineDash([]);
  }
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16) || 0;
  const g = parseInt(hex.slice(3, 5), 16) || 0;
  const b = parseInt(hex.slice(5, 7), 16) || 0;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function cancelCurrentStrokeAndRestore() {
  if (isDrawing && touchPreStrokeSnapshot) {
    try { inkCtx.putImageData(touchPreStrokeSnapshot, 0, 0); } catch (_) {}
  }
  isDrawing = false;
  points = [];
  shapeSnapshot = null;
  touchPreStrokeSnapshot = null;
  currentStroke = null;
}

// Stroke / Object Eraser Engine
function eraseStrokeAtPosition(pos) {
  const threshold = Math.max(15, eraserWidth / 2);
  let changed = false;

  strokesList = strokesList.filter(stroke => {
    if (activeEraserType === 'highlighterOnly' && !stroke.isHighlighter) {
      return true; // Keep non-highlighters
    }
    const hit = stroke.points.some(pt => Math.hypot(pt.x - pos.x, pt.y - pos.y) <= threshold);
    if (hit) changed = true;
    return !hit;
  });

  if (changed) {
    redrawAllStrokes();
  }
}

function redrawAllStrokes() {
  inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
  strokesList.forEach(stroke => {
    inkCtx.save();
    inkCtx.globalCompositeOperation = 'source-over';
    inkCtx.strokeStyle = stroke.color;
    inkCtx.fillStyle = stroke.fillColor || stroke.color;
    inkCtx.lineWidth = stroke.width;
    inkCtx.globalAlpha = stroke.alpha;
    inkCtx.lineCap = stroke.isHighlighter ? 'square' : 'round';
    inkCtx.lineJoin = 'round';
    if (stroke.dash) inkCtx.setLineDash(stroke.dash);

    if (stroke.isShape) {
      renderShape(stroke.shapeType, stroke.startX, stroke.startY, stroke.endX, stroke.endY, stroke.radius, stroke.fillMode);
    } else if (stroke.points.length > 1) {
      inkCtx.beginPath();
      inkCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
      for (let i = 1; i < stroke.points.length; i++) {
        const p1 = stroke.points[i - 1];
        const p2 = stroke.points[i];
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        inkCtx.quadraticCurveTo(p1.x, p1.y, midX, midY);
      }
      inkCtx.stroke();
    }
    inkCtx.restore();
  });
}

function onPointerDown(e) {
  if (currentCategory === 'hand') return;

  const pos = getCanvasPos(e);
  if (pos && pos.y) maxDrawnY = Math.max(maxDrawnY, pos.y);

  // Text Tool Placement
  if (currentCategory === 'text') {
    createInteractiveTextBox(pos.x, pos.y);
    return;
  }

  // Stroke Eraser
  if (currentCategory === 'eraser' && (activeEraserType === 'stroke' || activeEraserType === 'highlighterOnly')) {
    saveHistorySnapshot();
    eraseStrokeAtPosition(pos);
    isDrawing = true;
    return;
  }

  isDrawing = true;
  startX = pos.x;
  startY = pos.y;
  lastX = pos.x;
  lastY = pos.y;
  points = [pos];

  currentStroke = {
    color: activeColor,
    width: activeWidth,
    alpha: activeOpacity,
    isHighlighter: activePenType === 'highlighter',
    isShape: currentCategory === 'shape',
    shapeType: activeShapeType,
    radius: shapeCornerRadius,
    fillMode: shapeFillMode,
    dash: shapeLineStyle === 'dashed' ? [8, 6] : (shapeLineStyle === 'dotted' ? [3, 5] : []),
    startX: pos.x,
    startY: pos.y,
    points: [pos]
  };

  if (currentCategory === 'shape') {
    shapeSnapshot = inkCtx.getImageData(0, 0, inkCanvas.width, inkCanvas.height);
    return;
  }

  shapeSnapshot = null;
  configureDrawingContext();

  inkCtx.beginPath();
  inkCtx.moveTo(pos.x, pos.y);
  inkCtx.lineTo(pos.x + 0.1, pos.y + 0.1);
  inkCtx.stroke();
}

function onPointerMove(e) {
  if (!isDrawing) return;
  const pos = getCanvasPos(e);
  if (pos && pos.y) maxDrawnY = Math.max(maxDrawnY, pos.y);

  if (pos.y > canvasHeight - 500) {
    expandCanvasHeight(1500);
  }

  // Stroke Eraser Drag
  if (currentCategory === 'eraser' && (activeEraserType === 'stroke' || activeEraserType === 'highlighterOnly')) {
    eraseStrokeAtPosition(pos);
    return;
  }

  // Shape Preview Drawing
  if (currentCategory === 'shape') {
    if (shapeSnapshot) inkCtx.putImageData(shapeSnapshot, 0, 0);
    configureDrawingContext();
    renderShape(activeShapeType, startX, startY, pos.x, pos.y, shapeCornerRadius, shapeFillMode);
    return;
  }

  // Freehand Pen / Pixel Eraser Drawing
  configureDrawingContext();
  points.push(pos);
  if (currentStroke) currentStroke.points.push(pos);

  if (points.length > 2) {
    const p1 = points[points.length - 2];
    const p2 = points[points.length - 1];
    const midX = (p1.x + p2.x) / 2;
    const midY = (p1.y + p2.y) / 2;

    inkCtx.beginPath();
    inkCtx.moveTo(lastX, lastY);
    inkCtx.quadraticCurveTo(p1.x, p1.y, midX, midY);
    inkCtx.stroke();

    lastX = midX;
    lastY = midY;
  }
}

function onPointerUp(e) {
  if (!isDrawing) return;
  isDrawing = false;

  if (currentCategory === 'shape' && currentStroke) {
    const pos = e ? getCanvasPos(e) : { x: lastX, y: lastY };
    currentStroke.endX = pos.x;
    currentStroke.endY = pos.y;
    strokesList.push(currentStroke);
  } else if (currentStroke && currentCategory === 'pen') {
    strokesList.push(currentStroke);
  }

  points = [];
  shapeSnapshot = null;
  currentStroke = null;
  saveHistorySnapshot();
}

// Render Shapes with Corner Radius
function renderShape(type, x1, y1, x2, y2, radius, fillMode) {
  inkCtx.beginPath();

  if (type === 'line') {
    inkCtx.moveTo(x1, y1);
    inkCtx.lineTo(x2, y2);
    inkCtx.stroke();
  } else if (type === 'arrow' || type === 'doubleArrow') {
    inkCtx.moveTo(x1, y1);
    inkCtx.lineTo(x2, y2);
    inkCtx.stroke();
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const headLen = Math.max(14, activeWidth * 3.5);

    inkCtx.beginPath();
    inkCtx.moveTo(x2, y2);
    inkCtx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
    inkCtx.moveTo(x2, y2);
    inkCtx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
    inkCtx.stroke();

    if (type === 'doubleArrow') {
      inkCtx.beginPath();
      inkCtx.moveTo(x1, y1);
      inkCtx.lineTo(x1 + headLen * Math.cos(angle - Math.PI / 6), y1 + headLen * Math.sin(angle - Math.PI / 6));
      inkCtx.moveTo(x1, y1);
      inkCtx.lineTo(x1 + headLen * Math.cos(angle + Math.PI / 6), y1 + headLen * Math.sin(angle + Math.PI / 6));
      inkCtx.stroke();
    }
  } else if (type === 'rect') {
    const w = x2 - x1;
    const h = y2 - y1;
    if (fillMode !== 'outline') inkCtx.fillRect(x1, y1, w, h);
    inkCtx.strokeRect(x1, y1, w, h);
  } else if (type === 'roundedRect') {
    const minX = Math.min(x1, x2);
    const minY = Math.min(y1, y2);
    const w = Math.abs(x2 - x1);
    const h = Math.abs(y2 - y1);
    const r = Math.min(radius, w / 2, h / 2);

    inkCtx.beginPath();
    if (inkCtx.roundRect) {
      inkCtx.roundRect(minX, minY, w, h, r);
    } else {
      inkCtx.moveTo(minX + r, minY);
      inkCtx.lineTo(minX + w - r, minY);
      inkCtx.quadraticCurveTo(minX + w, minY, minX + w, minY + r);
      inkCtx.lineTo(minX + w, minY + h - r);
      inkCtx.quadraticCurveTo(minX + w, minY + h, minX + w - r, minY + h);
      inkCtx.lineTo(minX + r, minY + h);
      inkCtx.quadraticCurveTo(minX, minY + h, minX, minY + h - r);
      inkCtx.lineTo(minX, minY + r);
      inkCtx.quadraticCurveTo(minX, minY, minX + r, minY);
    }
    if (fillMode !== 'outline') inkCtx.fill();
    inkCtx.stroke();
  } else if (type === 'circle') {
    const rx = Math.abs(x2 - x1) / 2;
    const ry = Math.abs(y2 - y1) / 2;
    inkCtx.ellipse(Math.min(x1, x2) + rx, Math.min(y1, y2) + ry, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
    if (fillMode !== 'outline') inkCtx.fill();
    inkCtx.stroke();
  } else if (type === 'triangle') {
    inkCtx.moveTo((x1 + x2) / 2, Math.min(y1, y2));
    inkCtx.lineTo(Math.max(x1, x2), Math.max(y1, y2));
    inkCtx.lineTo(Math.min(x1, x2), Math.max(y1, y2));
    inkCtx.closePath();
    if (fillMode !== 'outline') inkCtx.fill();
    inkCtx.stroke();
  } else if (type === 'diamond') {
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;
    inkCtx.moveTo(midX, Math.min(y1, y2));
    inkCtx.lineTo(Math.max(x1, x2), midY);
    inkCtx.lineTo(midX, Math.max(y1, y2));
    inkCtx.lineTo(Math.min(x1, x2), midY);
    inkCtx.closePath();
    if (fillMode !== 'outline') inkCtx.fill();
    inkCtx.stroke();
  } else if (type === 'star') {
    drawStar(inkCtx, (x1 + x2) / 2, (y1 + y2) / 2, 5, Math.abs(x2 - x1) / 2, Math.abs(x2 - x1) / 4);
    if (fillMode !== 'outline') inkCtx.fill();
    inkCtx.stroke();
  }
}

function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
  let rot = Math.PI / 2 * 3;
  let x = cx;
  let y = cy;
  let step = Math.PI / spikes;

  ctx.beginPath();
  ctx.moveTo(cx, cy - outerRadius);
  for (let i = 0; i < spikes; i++) {
    x = cx + Math.cos(rot) * outerRadius;
    y = cy + Math.sin(rot) * outerRadius;
    ctx.lineTo(x, y);
    rot += step;

    x = cx + Math.cos(rot) * innerRadius;
    y = cy + Math.sin(rot) * innerRadius;
    ctx.lineTo(x, y);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerRadius);
  ctx.closePath();
}

// Interactive Text Box Engine
function createInteractiveTextBox(x, y) {
  const box = document.createElement('div');
  box.className = 'canvas-textbox';
  box.contentEditable = true;
  box.style.left = (x / (canvasWidth / inkCanvas.offsetWidth)) + 'px';
  box.style.top = (y / (canvasHeight / inkCanvas.offsetHeight)) + 'px';
  box.style.fontSize = activeFontSize + 'px';
  box.style.color = activeTextColor;

  textOverlayContainer.appendChild(box);
  box.focus();

  // Bake text into canvas on blur
  box.addEventListener('blur', () => {
    const text = box.innerText.trim();
    if (text) {
      saveHistorySnapshot();
      inkCtx.save();
      inkCtx.font = `${activeFontSize}px ${activeFontFamily}`;
      inkCtx.fillStyle = activeTextColor;
      inkCtx.textBaseline = 'top';

      const lines = text.split('\n');
      lines.forEach((line, idx) => {
        inkCtx.fillText(line, x, y + (idx * activeFontSize * 1.3));
      });
      inkCtx.restore();
    }
    box.remove();
  });
}

function insertQuickStickyNote() {
  const scrollY = workspace.scrollTop + 100;
  createInteractiveTextBox(200, scrollY);
}

// ============================================================
// 📱 IPAD MULTI-TOUCH GESTURE & SCROLLING SYSTEM
// ============================================================
inkCanvas.addEventListener('mousedown', (e) => {
  if (currentCategory === 'hand') {
    touchMode = 'scroll';
    panStartX = e.clientX;
    panStartY = e.clientY;
    scrollLeftStart = workspace.scrollLeft;
    scrollTopStart = workspace.scrollTop;
    workspace.classList.add('panning-active');
    return;
  }
  touchMode = 'draw';
  onPointerDown(e);
});

window.addEventListener('mousemove', (e) => {
  if (touchMode === 'scroll') {
    workspace.scrollLeft = scrollLeftStart - (e.clientX - panStartX);
    workspace.scrollTop = scrollTopStart - (e.clientY - panStartY);
    checkInfiniteScroll();
    return;
  }
  if (isDrawing) {
    onPointerMove(e);
  }
});

window.addEventListener('mouseup', (e) => {
  if (touchMode === 'scroll') {
    if (currentCategory !== 'hand') touchMode = 'draw';
    workspace.classList.remove('panning-active');
    return;
  }
  onPointerUp(e);
});

// Touch Events
inkCanvas.addEventListener('touchstart', (e) => {
  if (touchCooldown) {
    e.preventDefault();
    return;
  }

  // ✌️ MULTI-TOUCH (2+ fingers -> Always scroll without drawing)
  if (e.touches.length >= 2) {
    cancelCurrentStrokeAndRestore();
    isTwoFingerPanning = true;
    touchMode = 'scroll';
    panStartX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    panStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    scrollLeftStart = workspace.scrollLeft;
    scrollTopStart = workspace.scrollTop;
    workspace.classList.add('panning-active');
    e.preventDefault();
    return;
  }

  // ✋ Hand Pan Mode
  if (currentCategory === 'hand') {
    isTwoFingerPanning = true;
    touchMode = 'scroll';
    panStartX = e.touches[0].clientX;
    panStartY = e.touches[0].clientY;
    scrollLeftStart = workspace.scrollLeft;
    scrollTopStart = workspace.scrollTop;
    workspace.classList.add('panning-active');
    e.preventDefault();
    return;
  }

  // ✍️ Single Touch Drawing
  isTwoFingerPanning = false;
  touchMode = 'draw';
  try {
    touchPreStrokeSnapshot = inkCtx.getImageData(0, 0, inkCanvas.width, inkCanvas.height);
  } catch (_) {
    touchPreStrokeSnapshot = null;
  }

  e.preventDefault();
  onPointerDown(e);
}, { passive: false });

inkCanvas.addEventListener('touchmove', (e) => {
  if (e.touches.length >= 2 || isTwoFingerPanning || touchMode === 'scroll') {
    e.preventDefault();
    if (isDrawing) cancelCurrentStrokeAndRestore();
    isTwoFingerPanning = true;
    touchMode = 'scroll';

    const cx = e.touches.length >= 2 ? (e.touches[0].clientX + e.touches[1].clientX) / 2 : e.touches[0].clientX;
    const cy = e.touches.length >= 2 ? (e.touches[0].clientY + e.touches[1].clientY) / 2 : e.touches[0].clientY;

    workspace.scrollLeft = scrollLeftStart - (cx - panStartX);
    workspace.scrollTop = scrollTopStart - (cy - panStartY);
    checkInfiniteScroll();
    return;
  }

  if (isDrawing && !isTwoFingerPanning && !touchCooldown) {
    e.preventDefault();
    onPointerMove(e);
  }
}, { passive: false });

inkCanvas.addEventListener('touchend', (e) => {
  if (isTwoFingerPanning) {
    e.preventDefault();
    if (e.touches.length === 0) {
      isTwoFingerPanning = false;
      touchMode = currentCategory === 'hand' ? 'scroll' : 'draw';
      workspace.classList.remove('panning-active');
      touchPreStrokeSnapshot = null;
      isDrawing = false;
      points = [];
      touchCooldown = true;
      setTimeout(() => { touchCooldown = false; }, 150);
    }
    return;
  }

  if (isDrawing) {
    onPointerUp(e);
  }
  touchPreStrokeSnapshot = null;
});

inkCanvas.addEventListener('touchcancel', () => {
  cancelCurrentStrokeAndRestore();
  isTwoFingerPanning = false;
  touchMode = currentCategory === 'hand' ? 'scroll' : 'draw';
  workspace.classList.remove('panning-active');
  touchCooldown = false;
});

// Keyboard Shortcuts
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    if (e.shiftKey) handleRedo();
    else handleUndo();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
    e.preventDefault();
    handleRedo();
  }
});

// ============================================================
// 💾 SAVE & EXPORT
// ============================================================
function saveAndExport() {
  const exportHeight = Math.min(canvasHeight, Math.max(800, Math.ceil(maxDrawnY + 200)));
  const merged = document.createElement('canvas');
  merged.width = canvasWidth;
  merged.height = exportHeight;
  const mergedCtx = merged.getContext('2d');

  mergedCtx.drawImage(bgCanvas, 0, 0, canvasWidth, exportHeight, 0, 0, canvasWidth, exportHeight);
  mergedCtx.drawImage(inkCanvas, 0, 0, canvasWidth, exportHeight, 0, 0, canvasWidth, exportHeight);

  const dataUrl = merged.toDataURL('image/png');
  window.parent.postMessage({ type: 'STUDY_VAULT_CANVAS_SAVE', dataUrl: dataUrl }, '*');
}

function cancelAndExit() {
  window.parent.postMessage({ type: 'STUDY_VAULT_CANVAS_CANCEL' }, '*');
}

// Initial Setup
function initializeStudio() {
  bgCanvas.width = canvasWidth;
  bgCanvas.height = canvasHeight;
  inkCanvas.width = canvasWidth;
  inkCanvas.height = canvasHeight;

  drawPaperBackground(bgCtx, canvasWidth, canvasHeight, activePaper);
  renderContextualTray();
  updateFloatingPillUI();

  // Notify parent
  window.parent.postMessage({ type: 'STUDY_VAULT_STUDIO_READY' }, '*');
}

// Load Initial Image if editing existing note
let hasLoadedInitialImage = false;
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'STUDY_VAULT_LOAD_IMAGE' && e.data.image) {
    if (hasLoadedInitialImage) return;
    hasLoadedInitialImage = true;

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      canvasWidth = Math.max(1200, img.width);
      canvasHeight = Math.max(img.height + 1500, 3600);

      bgCanvas.width = canvasWidth;
      bgCanvas.height = canvasHeight;
      inkCanvas.width = canvasWidth;
      inkCanvas.height = canvasHeight;

      drawPaperBackground(bgCtx, canvasWidth, canvasHeight, activePaper);
      bgCtx.drawImage(img, 0, 0);
      inkCtx.clearRect(0, 0, canvasWidth, canvasHeight);
      maxDrawnY = Math.max(maxDrawnY, img.height);

      saveHistorySnapshot();

      setTimeout(() => {
        if (img.height > 400) {
          workspace.scrollTo({
            top: Math.max(0, img.height - 150),
            behavior: 'smooth'
          });
        }
      }, 100);
    };
    img.src = e.data.image;
  }
});

initializeStudio();
</script>
